apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudshield
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: cloudshield
        static_configs:
          - targets: ['labapp:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudshield
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.1
          args: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus','--storage.tsdb.retention.time=24h']
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 650Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: storage, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudshield
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cloudshield
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.2
          ports: [{containerPort: 3000}]
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: 'Viewer'}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: 'true'}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: '/var/lib/grafana/dashboards/cloudshield.json'}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 550Mi}
          volumeMounts:
            - {name: grafana-config, mountPath: /etc/grafana/provisioning/datasources/prometheus.yml, subPath: prometheus.yaml}
            - {name: grafana-config, mountPath: /etc/grafana/provisioning/dashboards/provider.yml, subPath: provider.yaml}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards/cloudshield.json, subPath: cloudshield.json}
      volumes:
        - name: grafana-config
          configMap: {name: grafana-provisioning}
        - name: dashboard
          configMap: {name: grafana-dashboard}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudshield
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
