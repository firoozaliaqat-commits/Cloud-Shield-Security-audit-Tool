apiVersion: batch/v1
kind: Job
metadata:
  name: suricata-demo
  namespace: cloudshield
spec:
  ttlSecondsAfterFinished: 1800
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: make-output-dir
          image: busybox:1.36
          command: ['sh','-c','mkdir -p /data/suricata && chmod 775 /data/suricata']
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: suricata
          image: jasonish/suricata:8.0
          command: ['suricata']
          args: ['-r','/case/lab-demo.pcap','-S','/case/lab.rules','-l','/data/suricata']
          resources:
            limits: {cpu: '1000m', memory: 850Mi}
          volumeMounts:
            - {name: case, mountPath: /case, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: case
          configMap: {name: suricata-case}
        - name: data
          persistentVolumeClaim: {claimName: lab-data}
